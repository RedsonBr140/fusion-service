apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusion-service-frontend
  namespace: fusion-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fusion-service-frontend
  template:
    metadata:
      labels:
        app: fusion-service-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/redsonbr140/fusion-service-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: fusion-service-backend
            - name: BACKEND_PORT
              value: "5050"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fusion-service-http
  namespace: fusion-service
spec:
  selector:
    app: fusion-service-frontend
  ports:
    - port: 8080
      targetPort: 8080

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fusion-service-https-redirect
  namespace: fusion-service
spec:
  redirectScheme:
    permanent: true
    scheme: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fusion-service
  namespace: fusion-service
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: cargas.k3s.natalhomecenter.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fusion-service-http
                port:
                  number: 8080
  tls:
    - hosts:
        - cargas.k3s.natalhomecenter.local
      secretName: fusion-service-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fusion-service-http-redirect
  namespace: fusion-service
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: fusion-service-fusion-service-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: cargas.k3s.natalhomecenter.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fusion-service-http
                port:
                  number: 8080
